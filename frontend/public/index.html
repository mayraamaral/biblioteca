<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Balcão da biblioteca</title><script defer src="/vendor/tailwind.js"></script>
</head>
<body class="bg-stone-100 text-stone-900 [&_button]:cursor-pointer [&_button]:rounded-md [&_button]:border [&_button]:border-teal-700/40 [&_button]:px-3 [&_button]:py-2 [&_button]:font-semibold [&_button:hover]:brightness-90 [&_button[aria-current=true]]:bg-teal-800 [&_button[aria-current=true]]:text-white [&_label]:grid [&_label]:gap-1 [&_input]:rounded-md [&_input]:border [&_input]:p-2 [&_select]:rounded-md [&_select]:border [&_select]:p-2">
  <header class="border-b-4 border-amber-400 bg-teal-950 text-white">
    <div class="mx-auto max-w-7xl px-4 py-8 sm:px-6 sm:py-12">
      <span class="text-xs font-bold tracking-widest">ACERVO / SISTEMA DE BIBLIOTECA</span>
      <h1 class="my-2 font-serif text-4xl sm:text-5xl">Balcão da biblioteca</h1>
      <p class="text-teal-100">Catálogo, leitores e circulação de exemplares.</p>
    </div>
  </header>
  <main class="mx-auto max-w-7xl p-4 sm:p-6">
    <nav class="flex flex-wrap gap-2" aria-label="Seções do sistema"></nav>
    <p id="message" role="status" class="my-3 min-h-5 text-sm text-teal-900">Carregando acervo…</p>
    <section class="rounded-xl border border-stone-200 bg-white p-4 shadow-sm sm:p-6">
      <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
        <div><small class="font-semibold tracking-widest text-teal-800">CONSULTA E CADASTRO</small><h2 id="heading" class="font-serif text-3xl">Catálogo</h2></div>
        <button id="add" class="bg-teal-800 text-white disabled:opacity-50" disabled>Novo registro</button>
      </div>
      <label class="max-w-md">Filtrar registros <input type="search" id="search" placeholder="Nome, título ou ID"></label>
      <div class="mt-4 overflow-x-auto"><table class="w-full text-left text-sm [&_th]:bg-teal-50 [&_th]:p-3 [&_td]:border-b [&_td]:border-stone-200 [&_td]:p-3 [&_button]:m-0.5"><thead></thead><tbody></tbody></table></div>
    </section>
  </main>
  <dialog aria-labelledby="form-title" class="m-auto max-h-[90vh] w-11/12 max-w-md rounded-xl bg-white p-6 shadow-xl backdrop:bg-teal-950/80">
    <form><h2 id="form-title" class="font-serif text-2xl"></h2><div id="inputs" class="my-4 grid gap-3"></div>
      <p role="alert" id="error" class="mb-3 text-sm text-red-800"></p>
      <div class="flex justify-end gap-2"><button type="button" id="cancel">Cancelar</button><button class="bg-teal-800 text-white">Salvar</button></div>
    </form>
  </dialog>
  <script type="module" src="/app.js"></script>
</body>
</html>
